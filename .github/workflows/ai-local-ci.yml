name: ai-local-ci

on:
  push:
    branches:
      - feat/ai-local

permissions:
  contents: write

concurrency:
  group: ai-local-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate server lockfile with npm when missing
        working-directory: server
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Commit npm-generated server lockfile
        shell: bash
        run: |
          if git diff --quiet -- server/package-lock.json && git ls-files --error-unmatch server/package-lock.json >/dev/null 2>&1; then
            echo "server/package-lock.json already tracked and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git commit -m "chore: lock server dependencies"
          git push origin HEAD:feat/ai-local

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Frontend regression tests
        run: npm test

      - name: Backend app regressions
        working-directory: server
        run: timeout 30s node --test test/app.test.js

      - name: Backend context regressions
        working-directory: server
        run: timeout 30s node --test test/context.test.js

      - name: Backend Ollama HTTP regressions
        working-directory: server
        run: timeout 30s node --test test/ollama-http.test.js

      - name: Backend date regressions
        working-directory: server
        run: timeout 30s node --test test/dates.test.js

      - name: Backend knowledge/data regressions
        working-directory: server
        run: timeout 30s node --test test/knowledge-db.test.js

      - name: Backend security/queue regressions
        working-directory: server
        run: timeout 30s node --test test/security-queue.test.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

